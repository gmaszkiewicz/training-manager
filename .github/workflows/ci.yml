name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run check:home-tokens
      - run: npx astro check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          exclude=studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          if ! supabase start -x "$exclude"; then
            supabase stop --no-backup || true
            supabase start -x "$exclude"
          fi
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          source supabase.env
          export SUPABASE_URL="$API_URL"
          export SUPABASE_KEY="$ANON_KEY"
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          exclude=studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          if ! supabase start -x "$exclude"; then
            supabase stop --no-backup || true
            supabase start -x "$exclude"
          fi
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Create the E2E user and write env files
        run: |
          source supabase.env
          email="e2e@example.com"
          password="E2e-Test-Passw0rd!"
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"data\":{\"role\":\"trainee\"}}"
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nE2E_USERNAME=%s\nE2E_PASSWORD=%s\n' \
            "$API_URL" "$ANON_KEY" "$email" "$password" > .env
          cp .env .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          exclude=studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          if ! supabase start -x "$exclude"; then
            supabase stop --no-backup || true
            supabase start -x "$exclude"
          fi
      - run: npm run migration-check
      - if: always()
        run: supabase stop --no-backup
